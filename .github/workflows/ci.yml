name: CI

on:
  push:
    branches:
      - main
      - "refactor/**"
      - "fix/**"
  pull_request:

permissions:
  contents: read

env:
  QT_QPA_PLATFORM: offscreen
  MPLBACKEND: QtAgg

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.10"
            numpy_spec: "numpy==1.26.4"
            label: "minimum-supported"
          - python: "3.11"
            numpy_spec: "numpy==1.26.4"
            label: "numpy-1.26"
          - python: "3.11"
            numpy_spec: "numpy>=2"
            label: "current-numpy"

    name: test (${{ matrix.label }})

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install "${{ matrix.numpy_spec }}" -e ".[dev]"
          python -c "import numpy, sys; print(sys.version); print('NumPy', numpy.__version__)"

      - name: Compile Python sources
        run: python -m compileall -q core models ui utils tests main.py

      - name: Lint Python sources
        run: ruff check core models ui utils tests main.py

      - name: Run test suite
        run: pytest -q
