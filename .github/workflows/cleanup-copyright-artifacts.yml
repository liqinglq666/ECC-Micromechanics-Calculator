name: One-time Copyright Cleanup

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/cleanup-copyright-artifacts.yml"

permissions:
  actions: write
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Remove copyright artifacts, runs and temporary branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10042759582" || true
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/artifacts/10044295720" || true
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/34192625687" || true
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/actions/runs/34197061210" || true
          gh api --method DELETE "/repos/${GITHUB_REPOSITORY}/git/refs/heads/copyright/source-export-20260908" || true
