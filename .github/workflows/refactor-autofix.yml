name: Refactor Autofix

on:
  push:
    branches: [refactor/stability-cleanup]
    paths:
      - ".github/workflows/refactor-autofix.yml"

permissions:
  contents: write

jobs:
  autofix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/stability-cleanup

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Ruff
        run: pip install ruff

      - name: Apply safe semantic race fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("ui/main_window.py")
          text = path.read_text(encoding="utf-8")

          old_csv = '''        entry = self._model.find_entry(series_id)\n        if entry is None:\n            return\n        entry.params.sigma_delta_mode = "csv"\n        entry.params.sigma_delta_df = df\n'''
          new_csv = '''        entry = self._model.find_entry(series_id)\n        if entry is None or entry.params.sigma_delta_mode != "csv":\n            return\n        entry.params.sigma_delta_df = df\n'''
          if old_csv not in text:
              raise SystemExit("CSV race patch target not found")
          text = text.replace(old_csv, new_csv, 1)

          old_sim = '''        entry = self._model.find_entry(series_id)\n        if entry is None:\n            return\n        expected = entry.params.simulation_signature()\n        actual = df.attrs.get("simulation_signature")\n        state = self._sim_ui_state.setdefault(series_id, _SimulationUiState())\n'''
          new_sim = '''        entry = self._model.find_entry(series_id)\n        state = self._sim_ui_state.setdefault(series_id, _SimulationUiState())\n        if entry is None:\n            return\n        if entry.params.sigma_delta_mode != "simulation":\n            state.status = "Simulation completed, but mode changed — result discarded."\n            if series_id == self._current_series_id:\n                self._sync_simulation_ui()\n            return\n        expected = entry.params.simulation_signature()\n        actual = df.attrs.get("simulation_signature")\n'''
          if old_sim not in text:
              raise SystemExit("Simulation race patch target not found")
          text = text.replace(old_sim, new_sim, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Apply Ruff safe fixes and formatting
        run: |
          ruff check core models ui utils tests main.py --fix || true
          ruff format core models ui utils tests main.py

      - name: Commit mechanical cleanup
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add core models ui utils tests main.py
          git commit -m "Apply refactor formatting and async mode-race fixes"
          git push origin HEAD:refactor/stability-cleanup
